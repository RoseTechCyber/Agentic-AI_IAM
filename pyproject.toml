[project]
name = "agentic-ai-iam"
version = "0.1.0"
description = "Self-hostable multi-agent IAM governance and anomaly detection POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "pydantic>=2.8.0,<3",
  "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0,<4"]
dev = ["pytest>=8.0.0,<9", "ruff>=0.6.0,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
